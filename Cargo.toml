[workspace]
resolver = "2"
members = [
    "crates/*"
]
default-members = ["crates/bridge"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#

util = { path = "crates/util" }
workspace = { path = "crates/workspace" }
collection = { path = "crates/collection" }
settings = { path = "crates/settings" }
http_editor = { path = "crates/http_editor" }
http_client = { path = "crates/http_client" }
title_bar = { path = "crates/title_bar" }

#
# External crates
#

parking_lot = "0.12"
anyhow = "1.0.100"
uuid = "1.18.1"
rust-embed = "8.8.0"
async-trait = "0.1.89"
futures-lite = "2.6.1"
bytes = "1.10.1"
http = "1.3.1"
async-channel = "2.5.0"
curl = { version = "0.4.49", features = ["http2", "static-curl"] }
curl-sys = { version = "0.4.83", features = ["static-ssl"] }
crossbeam-utils = "0.8.21"
polling = "3.11.0"
slab = "0.4.11"
url = "2.5.7"
regex = "1.12.2"
sluice = "0.6.0"
event-listener = "5.4.1"
waker-fn = "1.2.0"
indexmap = "2.12.0"
castaway = "0.2.4"
humantime = "2.3.0"
httpdate = "1.0.3"
encoding_rs = "0.8.35"
unicode-segmentation = "1.12.0"
mime = "0.3.17"
derive_more = { version = "2.0.1", features = ["full"] }
smallvec = "1.15.1"
config = { version = "0.15.18", default-features = false, features = ["async", "json5", "convert-case"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

gpui = { version = "*", features = ["runtime_shaders"] }
gpui-macros = { version = "*" }
gpui-component = { version = "0.4.0-preview1" }
